# Build and test KAT on every push and pull request.
# The test suite includes `imports_decode_golden`, which decodes every IMPORTS/*.sub capture and
# compares all fields with testdata/imports_decodes.txt, so a decoder regression fails CI.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libhackrf-dev libusb-1.0-0-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Lint vendored libhackrf
        run: cargo clippy -p libhackrf --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

      - name: Test vendored libhackrf
        run: cargo test -p libhackrf --locked

      # The vendored RTL-SDR driver: its ported tuner drivers against librtlsdr's I2C traces.
      - name: Test the RTL-SDR driver
        run: cargo test --locked -p rtl-sdr-rs --features rtl-sdr-rs/gpl-tuners

  # Windows x64 with MSYS2's UCRT64 environment, which packages Rust, libusb and the HackRF library.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 with Rust, libusb and the HackRF library
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            toolchain:p
            rust:p
            pkgconf:p
            libusb:p
            hackrf:p

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test vendored libhackrf
        run: cargo test -p libhackrf --locked

      - name: Test
        run: cargo test --locked
