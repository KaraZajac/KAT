<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAT // KEYFOB GRID</title>
<style>
  :root {
    --bg: #0a0e14; --bg2: #0f141d; --panel: #111a26; --border: #1e3a52;
    --cyan: #00e5ff; --green: #00ff9d; --magenta: #ff2d95; --amber: #ffb000;
    --red: #ff3355; --text: #c8d6e5; --dim: #5a7289;
    --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--mono); font-size: 13px; min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,229,255,0.02) 0 1px, transparent 1px 3px);
    pointer-events: none; z-index: 1000;
  }
  header {
    background: linear-gradient(180deg, #0d1622, #0a0e14);
    border-bottom: 1px solid var(--border);
    padding: 12px 18px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .logo h1 { font-size: 19px; color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,0.5); letter-spacing: 2px; }
  .logo .sub { font-size: 9px; color: var(--dim); letter-spacing: 3px; text-transform: uppercase; }
  .blink { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.2; } }
  .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--dim); }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.rx { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.idle { background: var(--dim); }
  .dot.disc { background: var(--red); box-shadow: 0 0 10px var(--red); }

  .btn {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    padding: 9px 18px; border: 1px solid; background: transparent; cursor: pointer;
    text-transform: uppercase; transition: all 0.15s;
  }
  .btn-rx { color: var(--green); border-color: var(--green); box-shadow: 0 0 12px rgba(0,255,157,0.2); }
  .btn-rx:hover { background: rgba(0,255,157,0.1); }
  .btn-stop { color: var(--red); border-color: var(--red); box-shadow: 0 0 12px rgba(255,51,85,0.2); }
  .btn-stop:hover { background: rgba(255,51,85,0.1); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* radio panel */
  .panel {
    background: var(--bg2); border: 1px solid var(--border); margin: 10px 14px;
    padding: 12px 16px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
  }
  .panel .group { display: flex; align-items: center; gap: 8px; }
  .panel label { font-size: 10px; color: var(--dim); letter-spacing: 1px; text-transform: uppercase; }
  .panel .val { color: var(--cyan); font-weight: 700; min-width: 70px; }
  .panel input[type=text] {
    background: var(--panel); border: 1px solid var(--border); color: var(--green);
    font-family: var(--mono); font-size: 12px; padding: 6px 10px; width: 90px;
  }
  .panel select {
    background: var(--panel); border: 1px solid var(--border); color: var(--cyan);
    font-family: var(--mono); font-size: 11px; padding: 6px 8px;
  }
  .panel input[type=range] { width: 110px; accent-color: var(--green); }
  .toggle {
    width: 44px; height: 22px; border-radius: 11px; background: var(--panel);
    border: 1px solid var(--border); position: relative; cursor: pointer; transition: background 0.15s;
  }
  .toggle::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--dim); transition: all 0.15s;
  }
  .toggle.on { background: rgba(0,255,157,0.2); border-color: var(--green); }
  .toggle.on::after { left: 24px; background: var(--green); box-shadow: 0 0 8px var(--green); }

  /* captures table */
  .tablewrap { height: calc(100vh - 280px); overflow-y: auto; padding: 6px 14px; }
  .tablewrap::-webkit-scrollbar { width: 8px; }
  .tablewrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; background: #0d1622; color: var(--cyan); font-size: 9px;
    letter-spacing: 2px; text-transform: uppercase; text-align: left; padding: 8px 10px;
    border-bottom: 2px solid var(--border); z-index: 10;
  }
  tbody tr.cap { cursor: pointer; border-bottom: 1px solid rgba(30,58,82,0.4); transition: background 0.1s; }
  tbody tr.cap:hover { background: rgba(0,229,255,0.06); }
  tbody tr.cap.sel { background: rgba(0,255,157,0.08); border-left: 3px solid var(--green); }
  tbody td { padding: 6px 10px; white-space: nowrap; }
  td.id { color: var(--dim); width: 45px; }
  td.ts { color: var(--amber); width: 85px; }
  td.proto { font-weight: 700; color: var(--green); min-width: 130px; }
  td.proto.none { color: var(--dim); font-weight: 400; }
  td.serial { color: var(--cyan); }
  td.btn { color: var(--magenta); width: 55px; }
  td.cnt { color: var(--dim); width: 60px; }
  td.crc { width: 60px; }
  td.crc.ok { color: var(--green); }
  td.crc.fail { color: var(--red); }
  td.freq { color: var(--dim); width: 90px; }

  /* action bar for selected capture */
  .actionbar {
    background: var(--panel); border: 1px solid var(--green); margin: 6px 14px; padding: 10px 14px;
    display: none; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .actionbar.open { display: flex; animation: slidein 0.15s; }
  @keyframes slidein { from { opacity: 0; transform: translateY(-4px); } }
  .actionbar .title { color: var(--green); font-size: 10px; letter-spacing: 2px; margin-right: 10px; }
  .abtn {
    font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 6px 12px; border: 1px solid var(--border); background: transparent; color: var(--text);
    cursor: pointer; text-transform: uppercase; transition: all 0.12s;
  }
  .abtn:hover { border-color: var(--cyan); color: var(--cyan); }
  .abtn.tx { color: var(--green); border-color: var(--green); }
  .abtn.tx:hover { background: rgba(0,255,157,0.1); }
  .abtn.exp { color: var(--amber); border-color: var(--amber); }
  .abtn.exp:hover { background: rgba(255,176,0,0.1); }
  .abtn.del { color: var(--red); border-color: var(--red); }
  .abtn.del:hover { background: rgba(255,51,85,0.1); }

  /* detail pane */
  .detail {
    background: var(--panel); border: 1px solid var(--cyan); margin: 6px 14px; padding: 12px;
    font-size: 11px; display: none;
  }
  .detail.open { display: block; }
  .detail h3 { color: var(--cyan); font-size: 10px; letter-spacing: 2px; margin-bottom: 8px; }
  .detail .kv { color: var(--dim); line-height: 1.7; }
  .detail .kv b { color: var(--text); font-weight: 400; }
  .detail pre {
    color: var(--text); font-size: 10px; line-height: 1.5; max-height: 200px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }

  .empty { text-align: center; color: var(--dim); padding: 50px 20px; }
  .empty .big { font-size: 30px; margin-bottom: 10px; }

  .statusbar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #0d1622;
    border-top: 1px solid var(--border); padding: 6px 18px; font-size: 10px; color: var(--dim);
    display: flex; justify-content: space-between; letter-spacing: 1px;
  }
  .statusbar .ok { color: var(--green); }
  .statusbar .err { color: var(--red); }
  .rssi { display: inline-block; width: 60px; height: 8px; background: var(--panel); border: 1px solid var(--border); vertical-align: middle; margin-left: 6px; }
  .rssi .fill { height: 100%; background: var(--green); box-shadow: 0 0 6px var(--green); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <h1>▓▒░ KAT ░▒▓</h1>
    <div class="sub">keyfob grid // HackRF <span class="blink">█</span></div>
  </div>
  <div class="controls">
    <div class="status">
      <span class="dot idle" id="dot"></span>
      <span id="statusText">IDLE</span>
      <span id="deviceText" style="color:var(--dim)"></span>
    </div>
    <button class="btn btn-rx" id="btnRx" onclick="toggleRx()">▶ RX</button>
  </div>
</header>

<div class="panel">
  <div class="group">
    <label>FREQ</label>
    <input type="text" id="freqInput" placeholder="433.92" onkeydown="if(event.key==='Enter')setFreq()">
    <button class="abtn" onclick="setFreq()">SET</button>
    <select id="freqPreset" onchange="presetFreq()">
      <option value="">preset…</option>
      <option value="300.00">300.00</option>
      <option value="303.875">303.875</option>
      <option value="310.00">310.00</option>
      <option value="315.00">315.00</option>
      <option value="318.00">318.00</option>
      <option value="390.00">390.00</option>
      <option value="433.92" selected>433.92</option>
      <option value="434.42">434.42</option>
      <option value="868.35">868.35</option>
      <option value="915.00">915.00</option>
    </select>
    <span class="val" id="freqVal">433.92 MHz</span>
  </div>
  <div class="group">
    <label>HOP</label>
    <div class="toggle" id="hopToggle" onclick="toggleHop()"></div>
  </div>
  <div class="group">
    <label>LNA</label>
    <input type="range" min="0" max="40" step="8" id="lnaRange" value="16" oninput="setLna()">
    <span class="val" id="lnaVal">16 dB</span>
  </div>
  <div class="group">
    <label>VGA</label>
    <input type="range" min="0" max="62" step="2" id="vgaRange" value="20" oninput="setVga()">
    <span class="val" id="vgaVal">20 dB</span>
  </div>
  <div class="group">
    <label>AMP</label>
    <div class="toggle" id="ampToggle" onclick="toggleAmp()"></div>
  </div>
</div>

<div class="actionbar" id="actionbar">
  <span class="title" id="abTitle">▸ CAPTURE</span>
  <button class="abtn tx" onclick="action('replay')">REPLAY</button>
  <button class="abtn tx" onclick="action('next_code')">NEXT CODE</button>
  <button class="abtn tx" onclick="action('lock')">LOCK</button>
  <button class="abtn tx" onclick="action('unlock')">UNLOCK</button>
  <button class="abtn tx" onclick="action('trunk')">TRUNK</button>
  <button class="abtn tx" onclick="action('panic')">PANIC</button>
  <button class="abtn exp" onclick="action('export_fob')">.FOB</button>
  <button class="abtn exp" onclick="action('export_flipper')">.SUB</button>
  <button class="abtn" onclick="showDetail()">DETAIL</button>
  <button class="abtn del" onclick="action('delete')">DELETE</button>
</div>

<div class="detail" id="detail"></div>

<div class="tablewrap">
  <table>
    <thead>
      <tr>
        <th>ID</th><th>Time</th><th>Protocol</th><th>Serial</th><th>Btn</th><th>Cnt</th><th>CRC</th><th>Freq</th><th>Data</th>
      </tr>
    </thead>
    <tbody id="caps"></tbody>
  </table>
  <div class="empty" id="empty">
    <div class="big">▓▒░</div>
    <div>press <b style="color:var(--green)">RX</b> to jack into the grid<br><br>
    <span style="font-size:10px">key fob / garage / gate signals appear here live</span></div>
  </div>
</div>

<div class="statusbar">
  <span id="sbLeft">KAT-web // ready</span>
  <span id="sbMsg">—</span>
  <span id="sbRight">● DISCONNECTED <span class="rssi"><span class="fill" id="rssiFill" style="width:0%"></span></span></span>
</div>

<script>
const caps = document.getElementById('caps');
const empty = document.getElementById('empty');
const actionbar = document.getElementById('actionbar');
const detail = document.getElementById('detail');
let selectedId = null;
let captures = [];
let receiving = false;
let ws;

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtSerial(s) { return s == null ? '—' : '0x' + Number(s).toString(16).toUpperCase().padStart(8,'0'); }
function fmtBtn(b) { return b == null ? '—' : '0x' + Number(b).toString(16).toUpperCase().padStart(2,'0'); }
function fmtCnt(c) { return c == null ? '—' : String(c); }

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => { document.getElementById('sbRight').firstChild.textContent = '● LIVE '; };
  ws.onclose = () => {
    document.getElementById('sbRight').firstChild.textContent = '● DISCONNECTED ';
    setTimeout(connect, 2000);
  };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'init') {
      captures = m.captures;
      renderState(m.state);
      renderCaps();
    } else if (m.type === 'capture') {
      captures.push(m.capture);
      addCap(m.capture);
    } else if (m.type === 'captures') {
      captures = m.captures;
      renderCaps();
    } else if (m.type === 'state') {
      renderState(m.state);
    }
  };
}

function renderState(s) {
  receiving = s.radio_state === 'RX';
  const dot = document.getElementById('dot');
  dot.className = 'dot ' + (receiving ? 'rx' : (s.radio_state === 'DISCONNECTED' ? 'disc' : 'idle'));
  document.getElementById('statusText').textContent = s.radio_state;
  document.getElementById('deviceText').textContent = s.device ? `· ${s.device}` : '';
  document.getElementById('btnRx').textContent = receiving ? '■ STOP' : '▶ RX';
  document.getElementById('btnRx').className = 'btn ' + (receiving ? 'btn-stop' : 'btn-rx');
  document.getElementById('freqVal').textContent = s.freq_mhz;
  document.getElementById('lnaVal').textContent = s.lna_gain + ' dB';
  document.getElementById('vgaVal').textContent = s.vga_gain + ' dB';
  document.getElementById('lnaRange').value = s.lna_gain;
  document.getElementById('vgaRange').value = s.vga_gain;
  document.getElementById('ampToggle').className = 'toggle' + (s.amp_enabled ? ' on' : '');
  document.getElementById('rssiFill').style.width = Math.min(100, (s.rssi || 0) * 100) + '%';
  const msg = s.error || s.status || '—';
  const sbMsg = document.getElementById('sbMsg');
  sbMsg.textContent = msg;
  sbMsg.className = s.error ? 'err' : 'ok';
}

function capRow(c) {
  const proto = c.protocol || 'unknown';
  const protoCls = c.protocol ? 'proto' : 'proto none';
  const crcCls = c.crc_valid ? 'crc ok' : 'crc fail';
  const crcTxt = c.crc_valid ? 'OK' : 'FAIL';
  const tr = document.createElement('tr');
  tr.className = 'cap';
  tr.dataset.id = c.id;
  tr.innerHTML =
    `<td class="id">${esc(c.id)}</td>` +
    `<td class="ts">${esc(c.timestamp)}</td>` +
    `<td class="${protoCls}">${esc(proto)}</td>` +
    `<td class="serial">${esc(fmtSerial(c.serial))}</td>` +
    `<td class="btn">${esc(fmtBtn(c.button))}</td>` +
    `<td class="cnt">${esc(fmtCnt(c.counter))}</td>` +
    `<td class="${crcCls}">${crcTxt}</td>` +
    `<td class="freq">${esc(c.freq_mhz)}</td>` +
    `<td class="freq" style="color:var(--dim)">${esc(c.data)}</td>`;
  tr.onclick = () => selectCap(c.id, tr);
  return tr;
}

function addCap(c) {
  empty.style.display = 'none';
  const tr = capRow(c);
  caps.insertBefore(tr, caps.firstChild);
  if (selectedId === null) {
    const wrap = document.querySelector('.tablewrap');
    wrap.scrollTop = 0;
  }
}
function renderCaps() {
  caps.innerHTML = '';
  empty.style.display = captures.length ? 'none' : '';
  for (let i = captures.length - 1; i >= 0; i--) {
    caps.appendChild(capRow(captures[i]));
  }
}

function selectCap(id, tr) {
  if (selectedId === id) {
    selectedId = null;
    tr.classList.remove('sel');
    actionbar.classList.remove('open');
    detail.classList.remove('open');
    return;
  }
  document.querySelectorAll('tr.cap.sel').forEach(r => r.classList.remove('sel'));
  tr.classList.add('sel');
  selectedId = id;
  const c = captures.find(x => x.id === id);
  document.getElementById('abTitle').textContent = `▸ CAPTURE ${id} · ${c ? (c.protocol || 'unknown') : ''}`;
  actionbar.classList.add('open');
  detail.classList.remove('open');
}

function action(act) {
  if (!selectedId) return;
  fetch('/api/action', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({action: act, id: selectedId})
  }).then(r => r.json()).then(d => {
    const sbMsg = document.getElementById('sbMsg');
    sbMsg.textContent = d.error || d.status || d.ok;
    sbMsg.className = d.error ? 'err' : 'ok';
    if (act === 'delete') {
      selectedId = null;
      actionbar.classList.remove('open');
      detail.classList.remove('open');
    }
  });
}

function showDetail() {
  if (!selectedId) return;
  if (detail.classList.contains('open')) {
    detail.classList.remove('open');
    return;
  }
  fetch(`/api/capture/${selectedId}`).then(r => r.json()).then(d => {
    const c = d.capture;
    const rp = d.raw_pairs || [];
    let pairs = '';
    for (const p of rp.slice(0, 60)) {
      pairs += `${p.level ? '█' : '░'} ${p.duration_us}µs\n`;
    }
    detail.innerHTML =
      `<h3>▸ CAPTURE ${c.id} — ${esc(c.protocol || 'unknown')}</h3>` +
      `<div class="kv">` +
      `time = <b>${esc(c.timestamp)}</b><br>` +
      `freq = <b>${esc(c.freq_mhz)}</b><br>` +
      `serial = <b>${esc(fmtSerial(c.serial))}</b><br>` +
      `button = <b>${esc(fmtBtn(c.button))}</b><br>` +
      `counter = <b>${esc(fmtCnt(c.counter))}</b><br>` +
      `crc = <b>${c.crc_valid ? 'OK' : 'FAIL'}</b><br>` +
      `data = <b>${esc(c.data)}</b> (${c.data_count_bit} bits)<br>` +
      `raw pairs = <b>${rp.length}</b>` +
      `</div>` +
      (rp.length ? `<pre>${esc(pairs)}${rp.length > 60 ? '…\n' : ''}</pre>` : '');
    detail.classList.add('open');
  });
}

// --- radio controls ---
function toggleRx() {
  // RX toggles receiving via the dedicated endpoint (the TUI's `r` key calls
  // toggle_receiving() directly; "r" is NOT a :command and would be rejected).
  fetch('/api/rx', {method: 'POST'})
    .then(r => r.json()).then(d => {
      const sbMsg = document.getElementById('sbMsg');
      sbMsg.textContent = d.error || d.status || (d.radio_state === 'RX' ? 'receiving' : 'stopped');
      sbMsg.className = d.error ? 'err' : 'ok';
    });
}
function setFreq() {
  const f = document.getElementById('freqInput').value.trim();
  if (!f) return;
  cmd(`freq ${f}`);
}
function presetFreq() {
  const f = document.getElementById('freqPreset').value;
  if (!f) return;
  document.getElementById('freqInput').value = f;
  cmd(`freq ${f}`);
}
function setLna() { cmd(`lna ${document.getElementById('lnaRange').value}`); }
function setVga() { cmd(`vga ${document.getElementById('vgaRange').value}`); }
function toggleAmp() {
  const on = !document.getElementById('ampToggle').classList.contains('on');
  cmd(`amp ${on ? 'on' : 'off'}`);
}
function toggleHop() {
  const on = !document.getElementById('hopToggle').classList.contains('on');
  cmd(`hop ${on ? 'on' : 'off'}`);
}
function cmd(c) {
  fetch('/api/command', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({cmd: c})
  }).then(r => r.json()).then(d => {
    const sbMsg = document.getElementById('sbMsg');
    sbMsg.textContent = d.error || d.status || c;
    sbMsg.className = d.error ? 'err' : 'ok';
  });
}

connect();
</script>
</body>
</html>
