# Build prebuilt KAT binaries and attach them to a GitHub release.
#
# Runs when a release is published. For a release made before this workflow existed, run it by hand:
#   gh workflow run release.yml -f tag=v1.5.0
#
# Linux builds use Ubuntu 22.04 (glibc 2.35) so the binaries also run on older distributions such as
# Debian 12 and Raspberry Pi OS. At runtime KAT needs the HackRF library (libhackrf.so.0 /
# libhackrf.0.dylib) and libusb, even when only an RTL-SDR is used. The Windows build comes from
# MSYS2's UCRT64 environment and ships as a .zip with those DLLs next to kat.exe.
name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v1.5.0)
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-linux
            shell: bash
          - os: ubuntu-22.04-arm
            target: aarch64-linux
            shell: bash
          - os: macos-latest
            target: aarch64-macos
            shell: bash
          - os: windows-latest
            target: x86_64-windows
            shell: msys2 {0}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install native libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libhackrf-dev libusb-1.0-0-dev

      - name: Install native libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install hackrf libusb pkg-config

      - name: Install MSYS2 with Rust, libusb and the HackRF library (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: zip
          pacboy: >-
            toolchain:p
            rust:p
            pkgconf:p
            libusb:p
            hackrf:p

      - name: Install Rust
        if: runner.os != 'Windows'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Check the binary starts
        run: ./target/release/kat --version

      - name: Package
        if: runner.os != 'Windows'
        run: |
          name="kat-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/kat README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          cat "dist/$name.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          name="kat-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp target/release/kat.exe README.md LICENSE CHANGELOG.md "dist/$name/"
          # The DLLs kat.exe loads from MSYS2: libhackrf, libusb and winpthreads.
          ldd target/release/kat.exe | awk '$3 ~ /^\/ucrt64\// {print $3}' | sort -u | xargs -r cp -t "dist/$name/"
          ls -l "dist/$name"
          (cd dist && zip -qr "$name.zip" "$name" && sha256sum "$name.zip" > "$name.zip.sha256")
          cat "dist/$name.zip.sha256"

      - name: Check the packaged binary starts outside MSYS2 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "dist/kat-$env:TAG-${{ matrix.target }}/kat.exe" --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Upload to the release
        shell: bash
        run: |
          shopt -s nullglob
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/*.sha256 --clobber
