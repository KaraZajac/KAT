<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The share card: rendered to og.png (1200 x 630) with a headless browser.
     It carries its own @font-face rules because it never loads style.css.
     The number of decoders is written here by hand: a release that changes it
     changes this file and renders og.png again. -->
<style>
@font-face {
  font-family: 'Source Serif 4';
  font-style: normal;
  font-weight: 200 900;
  src: url('fonts/source-serif-4-latin.woff2') format('woff2');
}
@font-face {
  font-family: 'Inter';
  font-style: normal;
  font-weight: 100 900;
  src: url('fonts/inter-latin.woff2') format('woff2');
}
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #ffffff; color: #1a1a18; font-family: "Inter", sans-serif;
  }
  .rule { position: absolute; left: 72px; right: 0; height: 2px; background: #1a1a18; }
  .rule.top { top: 64px; }
  .wrap { position: absolute; left: 72px; top: 96px; width: 540px; }
  .kicker { font-size: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #6a6963; }
  .name { font-family: "Source Serif 4", serif; font-weight: 650; font-size: 68px; letter-spacing: -0.018em; line-height: 1.06; margin: 20px 0 22px; }
  .tag { font-family: "Source Serif 4", serif; font-size: 27px; line-height: 1.36; color: #45443f; }
  .facts { position: absolute; left: 72px; bottom: 96px; font-size: 21px; font-weight: 500; color: #45443f; }
  .facts b { color: #1a1a18; font-weight: 700; }
  .url { position: absolute; left: 72px; bottom: 44px; font-size: 19px; color: #6a6963; }
  .win {
    position: absolute; left: 660px; top: 110px; width: 780px;
    border: 1px solid #d6d4cc; border-radius: 6px; overflow: hidden;
  }
  .win img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="rule top"></div>
  <div class="wrap">
    <div class="kicker">Software and reference work</div>
    <div class="name">KAT: Keyfob Analysis Toolkit</div>
    <div class="tag">Capturing, decoding and retransmitting the signals of car key fobs and gate remotes, from a terminal.</div>
  </div>
  <div class="facts"><b>166</b> protocol decoders · HackRF · RTL-SDR · Flipper Zero</div>
  <div class="url">kat.karazajac.io</div>
  <div class="win"><img src="img/kat-captures.webp" alt=""></div>
</body>
</html>
