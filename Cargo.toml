[package]
name = "kat"
version = "1.10.0"
edition = "2021"
description = "Keyfob Analysis Toolkit - key fob signal capture, decode and transmit with a HackRF, an RTL-SDR (receive only) or a Flipper Zero"
authors = ["KAT Team"]
license = "BSD-3-Clause"

[dependencies]
# TUI
ratatui = "0.29"
crossterm = "0.28"

# HackRF library
libhackrf = "0.1"

# RTL-SDR (receive-only support, e.g. RTL433 hardware)
rtl-sdr-rs = "0.3"

# Signal processing
num-complex = "0.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# INI config
configparser = "3"

# Config directory
dirs = "5.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# A Flipper Zero as the radio: its USB console (CDC serial). No default features: libudev (USB
# details on Linux) would need its headers to build; KAT finds the port under /dev/serial/by-id.
serialport = { version = "4.10.1", default-features = false }


[build-dependencies]
pkg-config = "0.3"

[patch.crates-io]
# Vendored with ARM fix: c_char is u8 on ARM, so the upstream transmute fails
libhackrf = { path = "vendor/libhackrf" }

[profile.release]
opt-level = 3
lto = true
