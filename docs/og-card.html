  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: radial-gradient(130% 130% at 10% 6%, #0f2a2c 0%, #07070d 52%, #0b0712 100%);
    color: #ecedf7; font-family: "Inter", sans-serif;
  }
  .wrap { position: absolute; left: 76px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 22px; }
  .brand img { width: 84px; height: 84px; border-radius: 19px; }
  .name { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.02em; line-height: 1; }
  .sub { font-family: "JetBrains Mono", monospace; font-size: 19px; letter-spacing: 0.3em; color: #8a8a9d; margin: 18px 0 30px; }
  .tag { font-size: 32px; line-height: 1.34; color: #c5c5d3; font-weight: 500; }
  .tag b { color: #ecedf7; font-weight: 700; }
  .facts { margin-top: 30px; font-family: "JetBrains Mono", monospace; font-size: 20px; color: #8a8a9d; }
  .facts b { color: #34d399; }
  .url { position: absolute; left: 76px; bottom: 40px; font-family: "JetBrains Mono", monospace; font-size: 20px; color: #5b5b75; }
  .win {
    position: absolute; left: 712px; top: 92px; width: 760px;
    background: #1e1e2e; border: 1px solid #25253c; border-radius: 14px; overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(16, 185, 129, 0.25), 0 20px 50px -10px rgba(0, 0, 0, 0.7);
  }
  .bar { display: flex; gap: 8px; padding: 12px 16px; background: rgba(0, 0, 0, 0.35); border-bottom: 1px solid #25253c; }
  .bar i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .win img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="logo.svg" alt=""><span class="name">KAT</span></div>
    <div class="sub">KEYFOB ANALYSIS TOOLKIT</div>
    <div class="tag">Capture, decode and retransmit <b>car key fob</b> and <b>gate remote</b> signals from a terminal.</div>
    <div class="facts"><b>150</b> decoders · HackRF · RTL-SDR · .sub</div>
  </div>
  <div class="url">kat.karazajac.io</div>
  <div class="win">
    <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
    <img src="img/kat-captures.webp" alt="">
  </div>
</body>
